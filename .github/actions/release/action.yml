name: Publish
description: Zip stitched modules, create a GitHub release, and record each artifact in vault.json
runs:
   using: 'composite'
   steps:
      -  name: Build
         shell: bash
         run: |
            set -e
            pushd dist
            for DIR in *; do
               pushd "${DIR}"
               cp metadata.json "../${DIR}.metadata.json"
               7z a -bb0 "../${DIR}.zip" *
               popd
            done
            popd

      # Validate BEFORE anything is published: a module that would
      # fail vault.ts add (previewless, or a version already recorded)
      # must not leave a published release with no vault update.
      -  name: Validate artifacts against the vault
         shell: bash
         run: |
            set -e
            for DIR in dist/*/; do
               DIR="${DIR%/}"
               node scripts/vault.ts add "${DIR}" --zip "${DIR}.zip" --skip-existing --check
            done

      -  name: Release
         uses: softprops/action-gh-release@v2
         with:
            files: |
               dist/*.zip
               dist/*.metadata.json

      # vault.ts add embeds metadata, updatedAt, and checksums, and
      # enforces the preview requirement. Versions already recorded are
      # skipped, never overwritten: a rewrite would change the checksum
      # (zips are not byte-reproducible) and reset updatedAt.
      -  name: Update vault.json
         shell: bash
         run: |
            set -e
            for DIR in dist/*/; do
               DIR="${DIR%/}"
               ARCHIVE="${DIR}.zip"
               URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${ARCHIVE##*/}"
               node scripts/vault.ts add "${DIR}" --artifact "${URL}" --zip "${ARCHIVE}" --skip-existing
            done
            rm -rf dist

      # Commit the vault change straight onto origin/main. The old
      # rebase flow rewrote newer main commits onto the vault commit
      # and the plain push was then rejected as non-fast-forward,
      # leaving a published release with no vault update.
      -  name: Commit vault.json onto main
         shell: bash
         env:
            PUSH_BRANCH: main
         run: |
            set -e
            git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
            git config --local user.name "$GITHUB_ACTOR"
            cp vault.json /tmp/vault.json
            git fetch origin "${PUSH_BRANCH}"
            git checkout -b vault-update "origin/${PUSH_BRANCH}"
            cp /tmp/vault.json vault.json
            git add vault.json
            if git diff --cached --quiet; then
               echo "vault unchanged"
               exit 0
            fi
            git commit -m 'Updated vault.json'
            git push origin "HEAD:${PUSH_BRANCH}"
