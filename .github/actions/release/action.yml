name: Publish
runs:
   using: 'composite'
   steps:
      -  name: Build
         shell: bash
         run: |
            set -e
            pushd dist
            for DIR in *; do
               pushd "${DIR}"
               cp metadata.json "../${DIR}.metadata.json"
               7z a -bb0 "../${DIR}.zip" *
               popd
            done
            popd

      -  name: Release
         uses: softprops/action-gh-release@v2
         with:
            files: |
               dist/*.zip
               dist/*.metadata.json

      # vault.ts add does what the raw yq edit did (artifacts, checksum,
      # providers) plus what it skipped: embedded metadata, updatedAt,
      # and the preview requirement, so a previewless module fails the
      # release loudly instead of landing in the vault invisible.
      -  name: Update vault.json
         shell: bash
         run: |
            set -e
            for DIR in dist/*/; do
               DIR="${DIR%/}"
               ARCHIVE="${DIR}.zip"
               URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${ARCHIVE##*/}"
               node scripts/vault.ts add "${DIR}" --artifact "${URL}" --zip "${ARCHIVE}"
            done
            rm -rf dist

      -  name: Git commit, rebase onto master
         shell: bash
         env:
            PUSH_BRANCH: main
            TMP_BRANCH: ${{ github.repository }}${{ github.run_id}}
         run: |
            git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
            git config --local user.name "$GITHUB_ACTOR"
            git checkout -b $TMP_BRANCH
            git add vault.json
            git commit -m 'Updated vault.json'
            git fetch
            git checkout -b $PUSH_BRANCH --track origin/${PUSH_BRANCH}
            git rebase $TMP_BRANCH $PUSH_BRANCH
            git push
