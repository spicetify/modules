name: Publish
description: Build one module, create its GitHub release, and record the artifact in vault.json
inputs:
   tag:
      description: The <name>@<version> to publish. Defaults to the triggering tag ref (publish.yml); release.yml passes each pending module explicitly.
      required: false
      default: ${{ github.ref_name }}
runs:
   using: 'composite'
   steps:
      # The tag is the contract: it must name a module directory whose
      # metadata.json agrees on name and version. A tag for an already
      # vault-recorded version makes the whole run a no-op (idempotent
      # re-run after a successful publish); anything else inconsistent
      # fails before a release exists.
      -  name: Resolve tag
         shell: bash
         run: |
            set -e
            TAG="${{ inputs.tag }}"
            NAME="${TAG%@*}"
            VERSION="${TAG##*@}"
            git fetch origin main
            git show origin/main:vault.json > /tmp/main-vault.json
            node -e '
               const { readFileSync, readdirSync, existsSync } = require("fs");
               const [name, version] = process.argv.slice(1);
               // Content roots, split by kind for repo navigation only.
               const roots = ["modules", "themes", "snippets"].filter((r) => existsSync(r));
               const dir = roots
                  .flatMap((root) => readdirSync(root, { withFileTypes: true })
                     .filter((d) => d.isDirectory() && existsSync(`${root}/${d.name}/metadata.json`))
                     .map((d) => `${root}/${d.name}`))
                  .find((d) => JSON.parse(readFileSync(`${d}/metadata.json`, "utf8")).name === name);
               if (!dir) throw new Error(`tag ${name}@${version}: no module with metadata name ${name}`);
               const meta = JSON.parse(readFileSync(`${dir}/metadata.json`, "utf8"));
               if (meta.version !== version) {
                  throw new Error(`tag ${name}@${version}: ${dir}/metadata.json declares ${meta.version}`);
               }
               const vault = JSON.parse(readFileSync("/tmp/main-vault.json", "utf8"));
               const published = !!vault.modules?.[name]?.v?.[version];
               // Ordering tripwire: legs run dependency-first only by observed
               // matrix behavior (release.yml), so enforce the invariant the
               // ordering exists for - the vault must never list a dependent
               // whose dependency is absent. A dependency published earlier in
               // this run is visible here because this step reads origin/main
               // fresh, after that leg's vault commit.
               const missing = Object.keys(meta.dependencies ?? {}).filter((d) => !vault.modules?.[d]);
               if (!published && missing.length) {
                  throw new Error(`refusing to publish ${name}@${version}: dependencies not in the vault: ${missing.join(", ")} (dependency legs must publish first)`);
               }
               console.log(published ? `${name}@${version} already in the vault: no-op re-run` : `publishing ${name}@${version} from ${dir}`);
               require("fs").appendFileSync(process.env.GITHUB_ENV, `MODULE_DIR=${dir}\nMODULE_TAG=${name}@${version}\nALREADY_PUBLISHED=${published}\n`);
            ' "$NAME" "$VERSION"

      # release.yml runs from a branch commit, so the tag ref may not
      # exist yet: create it here (with the default token, which by
      # design does NOT trigger publish.yml — the publish happens in
      # this run). A pre-existing tag must point at this commit or at a
      # published state; anything else is a racing manual tag.
      -  name: Ensure tag ref
         if: env.ALREADY_PUBLISHED == 'false'
         shell: bash
         run: |
            set -e
            if git rev-parse -q --verify "refs/tags/${MODULE_TAG}" >/dev/null; then
               TAG_SHA=$(git rev-parse "${MODULE_TAG}^{commit}")
               HEAD_SHA=$(git rev-parse HEAD)
               if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
                  echo "tag ${MODULE_TAG} exists at ${TAG_SHA}, not HEAD ${HEAD_SHA}: refusing to publish over a racing tag" >&2
                  exit 1
               fi
            else
               git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
               git config --local user.name "$GITHUB_ACTOR"
               git tag -a "${MODULE_TAG}" -m "${MODULE_TAG}"
               git push origin "refs/tags/${MODULE_TAG}"
            fi

      -  name: Build
         if: env.ALREADY_PUBLISHED == 'false'
         shell: bash
         run: |
            set -e
            node scripts/stitch.ts "${MODULE_DIR}"
            pushd "dist/${MODULE_TAG}"
            cp metadata.json "../${MODULE_TAG}.metadata.json"
            # zip -qr . matches vault.ts pack and includes dotfiles;
            # a shell glob would silently drop them.
            zip -qr "../${MODULE_TAG}.zip" .
            popd

      # Validate before the release exists: a module that would fail
      # vault.ts add (previewless, unhidden without artwork) must not
      # leave a published release with no vault update.
      -  name: Validate against the vault
         if: env.ALREADY_PUBLISHED == 'false'
         shell: bash
         run: node scripts/vault.ts add "dist/${MODULE_TAG}" --zip "dist/${MODULE_TAG}.zip" --skip-existing --check

      # The tag names what shipped; the body describes it, with the
      # checksum in sha256sum format. Bytes uploaded and checksum
      # recorded both come from this run's zip, so a re-run of a failed
      # publish stays self-consistent even though zips are not
      # byte-reproducible.
      -  name: Compose release notes
         if: env.ALREADY_PUBLISHED == 'false'
         shell: bash
         run: node scripts/release-notes.ts "${MODULE_TAG}" > /tmp/release-notes.md

      -  name: Release
         if: env.ALREADY_PUBLISHED == 'false'
         uses: softprops/action-gh-release@v2
         with:
            tag_name: ${{ inputs.tag }}
            body_path: /tmp/release-notes.md
            files: |
               dist/*.zip
               dist/*.metadata.json

      # Record the artifact on top of origin/main, never the tag's
      # vault.json: vault changes that landed after the tag (curated
      # edits, another publish) must survive. --skip-existing plus the
      # rebase retry make re-runs and races converge.
      -  name: Update vault.json on main
         if: env.ALREADY_PUBLISHED == 'false'
         shell: bash
         env:
            PUSH_BRANCH: main
         run: |
            set -e
            git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
            git config --local user.name "$GITHUB_ACTOR"
            git fetch origin "${PUSH_BRANCH}"
            git checkout -b vault-update "origin/${PUSH_BRANCH}"
            URL="https://github.com/${{ github.repository }}/releases/download/${MODULE_TAG}/${MODULE_TAG}.zip"
            node scripts/vault.ts add "dist/${MODULE_TAG}" --artifact "${URL}" --zip "dist/${MODULE_TAG}.zip" --skip-existing
            rm -rf dist
            git add vault.json
            if git diff --cached --quiet; then
               echo "vault unchanged"
               exit 0
            fi
            git commit -m "Publish ${MODULE_TAG}"
            git push origin "HEAD:${PUSH_BRANCH}" || {
               git fetch origin "${PUSH_BRANCH}"
               git rebase "origin/${PUSH_BRANCH}"
               git push origin "HEAD:${PUSH_BRANCH}"
            }
