name: Publish

# Releases are batch date tags: the repo has no repo-level version to
# name (modules version independently in their own metadata.json), so
# the tag identifies the publishing event. The optional suffix allows a
# same-day re-release: 2026-08-03, then 2026-08-03.1. Any other tag
# must not trigger a real publish.
on:
   push:
      tags:
         - "20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]*"

# Two publishes must never interleave: both would build a vault commit
# on top of origin/main and race the push.
concurrency:
   group: publish
   cancel-in-progress: false

jobs:
   publish:
      name: Publish
      runs-on: ubuntu-latest

      permissions:
         contents: write

      steps:
         -  name: Clone repository
            uses: actions/checkout@v4
            with:
               # release.ts status diffs modules/ against the previous
               # tag; the default shallow clone has neither tags nor
               # history to compare with.
               fetch-depth: 0

         -  name: Clone classmaps
            uses: actions/checkout@v4
            with:
               repository: spicetify/classmaps
               path: classmaps

         -  name: Setup pnpm
            uses: pnpm/action-setup@v6

         -  name: Setup Node
            uses: actions/setup-node@v6
            with:
               node-version: "24"
               cache: pnpm

         -  name: Install dependencies
            run: pnpm install --frozen-lockfile

         # Gate: a module changed since the previous tag must carry a new
         # metadata.json version, or the publish would overwrite a live
         # vault version and the store's update detection would miss it.
         -  name: Check version bumps
            run: node scripts/release.ts status

         # Gate: every workspace dependency range must be satisfied by the
         # dependency's version or its compat list — an unsatisfied range
         # ships modules the loader refuses at boot (the stdlib 1.0.0 bump
         # blacked out all 14 dependents this way).
         -  name: Check dependency ranges
            run: node scripts/check-deps.ts

         -  name: Build modules
            run: node scripts/stitch.ts

         -  name: Publish
            uses: ./.github/actions/release
