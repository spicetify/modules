name: Submission

# A vault entry is a URL plus a checksum for bytes this repo never wrote, so
# the entry is a claim and this job is where it gets checked: the artifact is
# downloaded and hashed here, and every rule (immutability, version order, id
# ownership, card honesty, zip safety) is enforced against the artifact
# rather than against what the pull request says about it.
on:
   pull_request:
      paths:
         - "vault/**"
   merge_group:

concurrency:
   group: submission-${{ github.ref }}
   cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
   validate:
      name: Validate vault submission
      runs-on: ubuntu-latest
      # Read-only: this job fetches attacker-supplied URLs, so it must not
      # be able to write anything back.
      permissions:
         contents: read
      steps:
         # The submission itself, checked out where nothing runs from it.
         -  name: Clone the submission
            uses: actions/checkout@v4
            with:
               fetch-depth: 0
               path: submission

         # The validator, taken from the base branch. Running it from the
         # pull request's own tree would let a submission edit the gate that
         # polices it (or add a postinstall that rewrites it), and report
         # itself green.
         -  name: Clone the validator from the base branch
            uses: actions/checkout@v4
            with:
               ref: ${{ github.event.pull_request.base.sha || github.sha }}
               path: validator

         -  name: Setup Node
            uses: actions/setup-node@v6
            with:
               node-version: "24"

         # Defence in depth: a submission is one or more files under vault/,
         # and nothing else. A PR that also touches scripts, workflows or
         # package.json is a repository change that belongs in its own review,
         # not something this job should be validating.
         -  name: Submission touches only vault/
            working-directory: submission
            env:
               BASE_SHA: ${{ github.event.pull_request.base.sha }}
            run: |
               set -e
               BASE=${BASE_SHA:-$(git rev-parse HEAD~1)}
               outside=$(git diff --name-only "$BASE...HEAD" -- . ':(exclude)vault/**')
               if [ -n "$outside" ]; then
                  echo "::error::a vault submission must touch only vault/; this PR also changes:"
                  echo "$outside"
                  exit 1
               fi

         # The validator resolves sources and runs git against the working
         # directory, so cwd is the submission while the code is the base
         # branch's. It imports only node builtins and its own siblings, so
         # no dependency install is needed here.
         -  name: Validate
            working-directory: submission
            env:
               BASE_SHA: ${{ github.event.pull_request.base.sha }}
            run: |
               set -e
               BASE=${BASE_SHA:-$(git rev-parse HEAD~1)}
               node "$GITHUB_WORKSPACE/validator/scripts/validate-submission.ts" --base "$BASE"
