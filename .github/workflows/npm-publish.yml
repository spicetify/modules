name: Release npm packages

on:
   push:
      branches:
         - main
   workflow_dispatch:
      inputs:
         recover_npm:
            description: Publish current package versions that have a public GitHub release but are missing from npm
            required: false
            default: false
            type: boolean

concurrency:
   group: npm-release
   cancel-in-progress: false

jobs:
   release:
      name: Prepare release
      runs-on: ubuntu-latest
      permissions:
         actions: write
         contents: write
         issues: write
         pull-requests: write
      outputs:
         kit_released: ${{ steps.release.outputs['packages/kit--release_created'] }}
         launcher_released: ${{ steps.release.outputs['packages/create-spicetify-module--release_created'] }}

      steps:
         -  name: Create or update release pull request
            id: release
            # v5.0.0; pinned because this job can create pull requests, tags,
            # and releases with write access to the repository.
            uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
            with:
               token: ${{ secrets.GITHUB_TOKEN }}
               config-file: release-please-config.json
               manifest-file: .release-please-manifest.json

         # Events created with GITHUB_TOKEN do not recursively start another
         # workflow. Explicit dispatch gives the generated release PR the same
         # required CI check as an ordinary contributor PR without a PAT.
         -  name: Run CI for release pull request
            if: steps.release.outputs.prs_created == 'true'
            env:
               GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            run: |
               gh pr list \
                  --repo "$GITHUB_REPOSITORY" \
                  --state open \
                  --label "autorelease: pending" \
                  --json headRefName \
                  --jq '.[].headRefName' |
               while IFS= read -r branch; do
                  if [ -n "$branch" ]; then
                     gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
                  fi
               done

   publish:
      name: Publish released packages
      needs: release
      if: needs.release.outputs.kit_released == 'true' || needs.release.outputs.launcher_released == 'true' || (github.event_name == 'workflow_dispatch' && inputs.recover_npm)
      runs-on: ubuntu-latest
      environment: npm
      permissions:
         contents: read
         id-token: write

      steps:
         -  name: Clone repository
            uses: actions/checkout@v6
            with:
               persist-credentials: false

         -  name: Clone classmaps
            uses: actions/checkout@v6
            with:
               repository: spicetify/classmaps
               path: classmaps
               persist-credentials: false

         -  name: Setup pnpm
            uses: pnpm/action-setup@v6

         -  name: Setup Node
            uses: actions/setup-node@v6
            with:
               node-version: "24"
               registry-url: "https://registry.npmjs.org"
               # Release builds must not restore a writable dependency cache.
               package-manager-cache: false

         -  name: Install dependencies
            run: pnpm install --frozen-lockfile

         # The build generates each module's classmap.d.ts. TypeScript checks
         # consume those declarations, so publication must preserve the same
         # build-before-check ordering as the required CI workflow.
         -  name: Build modules
            run: node scripts/stitch.ts

         -  name: Verify repository
            run: |
               pnpm check
               pnpm test
               pnpm --dir packages/kit test

         # A GitHub release can be created before a later verification step
         # fails. A protected manual recovery must be idempotent: publish only
         # versions still absent from npm, and only when their public release
         # already exists.
         -  name: Resolve unpublished package versions
            id: plan
            env:
               GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            run: |
               set -euo pipefail

               is_published() {
                  local package="$1"
                  local version="$2"
                  local versions
                  versions=$(npm view "$package" versions --json)
                  node -e '
                     const value = JSON.parse(process.argv[1]);
                     const versions = Array.isArray(value) ? value : [value];
                     process.exit(versions.includes(process.argv[2]) ? 0 : 1);
                  ' "$versions" "$version"
               }

               plan() {
                  local output="$1"
                  local package="$2"
                  local version="$3"
                  local tag="$4"
                  if is_published "$package" "$version"; then
                     echo "$output=false" >> "$GITHUB_OUTPUT"
                     return
                  fi
                  test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '(.isDraft == false) and (.isPrerelease == false)')" = true
                  echo "$output=true" >> "$GITHUB_OUTPUT"
               }

               kit_version=$(node -p "require('./packages/kit/package.json').version")
               launcher_version=$(node -p "require('./packages/create-spicetify-module/package.json').version")
               plan kit @spicetify/kit "$kit_version" "kit@$kit_version"
               plan launcher create-spicetify-module "$launcher_version" "create-spicetify-module@$launcher_version"

         # Dependency order is intentional: when both versions change, the
         # launcher must never point at a kit version that is not live yet.
         -  name: Inspect kit package
            if: steps.plan.outputs.kit == 'true'
            run: npm pack --dry-run --json ./packages/kit

         -  name: Publish kit package
            if: steps.plan.outputs.kit == 'true'
            run: npm publish ./packages/kit

         -  name: Inspect launcher package
            if: steps.plan.outputs.launcher == 'true'
            run: npm pack --dry-run --json ./packages/create-spicetify-module

         -  name: Publish launcher package
            if: steps.plan.outputs.launcher == 'true'
            run: npm publish ./packages/create-spicetify-module
